# Publishes the site to GitHub Pages on every push to main.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the data files
        run: node scripts/validate-data.mjs
      - name: Build link-preview pages for each event
        run: node scripts/build-share-pages.mjs
      - name: Stamp asset URLs with this commit so browsers load the new version
        run: |
          v="${GITHUB_SHA::7}"
          sed -i "s/?v=dev/?v=$v/g" index.html assets/js/app.js
          grep -q "?v=$v" index.html && grep -q "?v=$v" assets/js/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
